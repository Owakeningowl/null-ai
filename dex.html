	<script>
		(function () {
			var theme = 'light';
			try {
				var savedTheme = localStorage.getItem('nulldex-theme');
				if (savedTheme === 'dark' || savedTheme === 'light') theme = savedTheme;
			} catch (e) {}
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>

  <script>
/* Default this dex to dark, but never override a choice you have made.
   Runs before paint so there is no white flash. */
(function(){
  try{
    if(!localStorage.getItem('nulldex-theme')) localStorage.setItem('nulldex-theme','dark');
    document.documentElement.setAttribute('data-theme', localStorage.getItem('nulldex-theme'));
  }catch(e){}
})();
</script>

.pfx-topbar .header{ min-height:0 !important; }
