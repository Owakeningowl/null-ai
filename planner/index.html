<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Null Doubles Planner</title>
<style>
:root{
  --bg:#15181f; --panel:#1c2028; --panel-2:#20242e; --line:#2b3140;
  --ink:#d1d5de; --ink-2:#98a0b0; --ink-3:#6b7383;
  --you:#4a7fb5; --foe:#b5544a; --accent:#3a4462; --ok:#7fb58a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
header .hint{color:var(--ink-3);font-size:12px}
header .sp{margin-left:auto;display:flex;gap:7px}
button{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit;font-size:12.5px}
button:hover{border-color:var(--ink-3)}
button.warn:hover{border-color:var(--foe);color:#e8a49c}
main{flex:1;display:grid;grid-template-columns:246px 1fr;min-height:0}

/* ---- tray ---- */
#tray{border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#search{margin:10px;padding:7px 9px;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;color:var(--ink);font:inherit;font-size:13px}
#search:focus{outline:none;border-color:var(--accent)}
#results{flex:1;overflow-y:auto;padding:0 6px 10px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start}
.cand{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;
  border-radius:6px;cursor:grab;border:1px solid transparent}
.cand:hover{background:var(--panel-2);border-color:var(--line)}
.cand img{width:52px;height:52px;object-fit:contain;pointer-events:none}
.cand span{font-size:9.5px;color:var(--ink-2);text-align:center;line-height:1.15;
  word-break:break-word}
#count{color:var(--ink-3);font-size:11px;padding:0 12px 8px}

/* ---- board ---- */
#board{overflow-y:auto;padding:14px 16px 30px}
.side{margin-bottom:14px}
.side h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 7px;display:flex;align-items:center;gap:8px}
.side h2::after{content:"";flex:1;height:1px;background:var(--line)}
.side.foe h2{color:#b5776f}
.side.you h2{color:#6f93b5}
.row{display:flex;gap:9px;flex-wrap:wrap}
.slot{width:118px;height:150px;border:1.5px dashed var(--line);border-radius:9px;
  background:var(--panel);display:flex;flex-direction:column;align-items:center;
  justify-content:center;position:relative;transition:border-color .12s,background .12s}
.slot.active{border-style:solid;border-width:2px}
.side.you .slot.active{border-color:var(--you)}
.side.foe .slot.active{border-color:var(--foe)}
.slot.bench{height:104px;width:96px}
.slot.over{border-color:var(--ok);background:#1f2a24}
.slot .tag{position:absolute;top:5px;left:7px;font-size:9px;letter-spacing:.1em;
  color:var(--ink-3);text-transform:uppercase}
.slot .empty{color:var(--ink-3);font-size:11px}
.mon{display:flex;flex-direction:column;align-items:center;width:100%;cursor:grab}
.mon img{width:66px;height:66px;object-fit:contain;pointer-events:none}
.slot.bench .mon img{width:52px;height:52px}
.mon .nm{font-size:10.5px;text-align:center;line-height:1.2;padding:0 3px;
  word-break:break-word}
.mon .meta{font-size:9.5px;color:var(--ink-3);margin-top:1px}
.slot .x{position:absolute;top:3px;right:5px;color:var(--ink-3);cursor:pointer;
  font-size:14px;line-height:1;display:none}
.slot:hover .x{display:block}
.slot .x:hover{color:var(--foe)}

/* ---- detail ---- */
#detail{position:fixed;right:16px;bottom:16px;width:250px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:12px;display:none;
  box-shadow:0 10px 30px #0008}
#detail.on{display:block}
#detail h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:7px}
#detail h3 img{width:34px;height:34px;object-fit:contain}
#detail label{display:block;font-size:10px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.09em;margin:7px 0 2px}
#detail input,#detail textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:5px;color:var(--ink);font:inherit;font-size:12.5px;padding:5px 7px}
#detail textarea{height:52px;resize:vertical}
#detail .close{position:absolute;top:8px;right:10px;color:var(--ink-3);cursor:pointer}
#detail .close:hover{color:var(--ink)}

/* ---- speed strip ---- */
#speed{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;margin-bottom:14px}
#speed .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:6px}
#order{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:34px}
#order .u{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:14px;
  font-size:11.5px;border:1px solid var(--line)}
#order .u img{width:24px;height:24px;object-fit:contain}
#order .u.you{background:#1b2734;border-color:#2d4560}
#order .u.foe{background:#2e1f1d;border-color:#5a3330}
#order .arrow{color:var(--ink-3);font-size:11px}
#order .none{color:var(--ink-3);font-size:12px}
</style></head>
<body>
<header>
  <h1>Null Doubles Planner</h1>
  <span class="hint">drag a sprite onto a slot &middot; click a placed mon to add level / notes</span>
  <span class="sp">
    <button id="save">Save</button>
    <button id="load">Load</button>
    <button id="clear" class="warn">Clear</button>
  </span>
</header>
<main>
  <div id="tray">
    <input id="search" placeholder="search pokemon…" autocomplete="off">
    <div id="count"></div>
    <div id="results"></div>
  </div>
  <div id="board">
    <div id="speed"><div class="lbl">Turn order (by speed)</div><div id="order"></div></div>
    <div class="side foe">
      <h2>Opponent &mdash; active</h2>
      <div class="row" id="foe-active"></div>
      <h2 style="margin-top:10px">Opponent &mdash; bench</h2>
      <div class="row" id="foe-bench"></div>
    </div>
    <div class="side you">
      <h2>Your side &mdash; active</h2>
      <div class="row" id="you-active"></div>
      <h2 style="margin-top:10px">Your side &mdash; bench</h2>
      <div class="row" id="you-bench"></div>
    </div>
  </div>
</main>
<div id="detail">
  <span class="close" id="dclose">&times;</span>
  <h3><img id="dimg" alt=""><span id="dname"></span></h3>
  <label>Level</label><input id="dlevel" type="number" min="1" max="100">
  <label>Speed</label><input id="dspeed" type="number" min="0" placeholder="for turn order">
  <label>Item / ability</label><input id="ditem" placeholder="e.g. Focus Sash · Levitate">
  <label>Notes</label><textarea id="dnotes" placeholder="moves, plan, threats…"></textarea>
</div>
<script src="app.js"></script>
</body></html>
<style>
.mega{display:inline-block;margin-left:3px;padding:0 3px;border-radius:3px;
  background:#5a4a7a;color:#e6dcff;font-size:8px;font-weight:700;letter-spacing:.06em;
  vertical-align:middle}
</style>
